spring.profiles.active=dev

# Default (development) profile: in-memory H2 configured to operate in MySQL mode
spring.datasource.url=jdbc:h2:mem:task_manager;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# H2 console for local development
spring.h2.console.enabled=true

# Security: user-backed authentication will be used; do not rely on the default in-memory user.
# Production credentials must be provided via application-mysql.properties or environment variables.
